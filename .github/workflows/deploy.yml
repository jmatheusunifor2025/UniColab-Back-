name: Build & Deploy

# Cada merge na main gera a imagem Docker aqui no GitHub Actions,
# publica no GHCR e pede para o Dokploy implantar essa versão.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Image name
        id: meta
        run: |
          # O nome do repositório termina com hífen, e o GHCR recusa esse caractere no fim.
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[A-Z]' '[a-z]' | sed -E 's/[-._]+$//')
          echo "repo=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --push \
            --tag ${{ steps.meta.outputs.image }} \
            --tag ${{ steps.meta.outputs.repo }}:latest \
            .

      - name: Tornar a imagem pública
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package=$(basename "${{ steps.meta.outputs.repo }}")
          for i in 1 2 3 4 5 6; do
            if gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${package}/visibility" \
              -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "Não foi possível tornar o pacote ${package} público."
          exit 1

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Enquanto os secrets do Dokploy não forem cadastrados, só a imagem é publicada.
      - name: Check Dokploy secrets
        id: check
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::warning::Secrets do Dokploy não configurados — deploy ignorado (imagem publicada no GHCR)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Dokploy
        if: steps.check.outputs.ok == 'true'
        uses: nodilabs/dokploy-deploy-action@v0.1.0
        with:
          dokploy_api_key: ${{ secrets.DOKPLOY_API_KEY }}
          dokploy_server_url: ${{ secrets.DOKPLOY_SERVER_URL }}
          application_ids: ${{ secrets.DOKPLOY_APPLICATION_IDS }}
          image_tag: ${{ needs.build-and-push.outputs.image }}
